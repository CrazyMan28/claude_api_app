name: Build Windows app

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: UI end-to-end test (Electron under Xvfb)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node e2e/ui.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: e2e/screenshots/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - name: Unit tests (Windows PowerShell, paths, DPAPI-free)
        run: npm test
      - run: npm run build
      - name: UI end-to-end test on Windows (real DPAPI key storage)
        run: node e2e/ui.e2e.mjs
      - name: Package installer and portable EXE
        run: npx electron-builder --win --publish never
      - name: Smoke-test the packaged app
        run: node e2e/packaged-smoke.mjs
      - name: List build output
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Windows-1.0.${{ github.run_number }}
          path: |
            dist/Forge-Setup-*.exe
            dist/Forge-Portable-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: e2e/screenshots/
          if-no-files-found: ignore
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Forge v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Forge — a Windows desktop coding agent that calls the Anthropic Messages API directly with your own API key.

            **Downloads**
            - `Forge-Setup-1.0.${{ github.run_number }}.exe` — installer (recommended)
            - `Forge-Portable-1.0.${{ github.run_number }}.exe` — single-file portable build, no install

            The executables are not code-signed, so Windows SmartScreen may show "Windows protected your PC". Click **More info → Run anyway**.

            Built from ${{ github.sha }}.
          files: |
            dist/Forge-Setup-*.exe
            dist/Forge-Portable-*.exe
