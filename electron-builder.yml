appId: com.crazyman28.forge
productName: Forge
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Forge
  artifactName: Forge-Setup-${version}.${ext}
portable:
  artifactName: Forge-Portable-${version}.${ext}
publish: null
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  executableName: forge
  syncDesktopName: true
  maintainer: CrazyMan28
  synopsis: Claude coding agent
  description: Desktop coding agent powered directly by the Anthropic Messages API.
appImage:
  artifactName: Forge-${version}-x86_64.${ext}
deb:
  artifactName: Forge-${version}-amd64.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
